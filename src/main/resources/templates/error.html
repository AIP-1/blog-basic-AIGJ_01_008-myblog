<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('오류')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container narrow">
    <h1 th:text="${status}">오류</h1>
    <p th:switch="${status}">
        <span th:case="403">이 작업을 할 권한이 없습니다.</span>
        <span th:case="404">페이지를 찾을 수 없습니다.</span>
        <span th:case="*">요청을 처리하는 중 문제가 발생했습니다.</span>
    </p>
    <a class="btn" th:href="@{/}">홈으로</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
