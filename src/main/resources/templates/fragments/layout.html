<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)" th:with="blogTitle=${blog?.title ?: 'Java 블로그'}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <title th:text="${title} + ' · ' + ${blogTitle}">Java 블로그</title>

    <!-- 링크 공유 시 미리보기 카드 (카카오톡, 페이스북, X, 슬랙 등) -->
    <th:block th:with="desc=${summary ?: (blog?.description ?: 'Java 입문·중급 강좌와 코드 실행기가 있는 블로그입니다.')}">
        <meta name="description" th:content="${desc}">
        <meta property="og:site_name" th:content="${blogTitle}">
        <meta property="og:type" th:content="${summary != null} ? 'article' : 'website'">
        <meta property="og:title" th:content="${title}">
        <meta property="og:description" th:content="${desc}">
        <meta property="og:url" th:if="${currentUrl != null}" th:content="${currentUrl}">
        <meta property="og:image" th:if="${ogImage != null}" th:content="${ogImage}">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:locale" content="ko_KR">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" th:content="${title}">
        <meta name="twitter:description" th:content="${desc}">
        <meta name="twitter:image" th:if="${ogImage != null}" th:content="${ogImage}">
    </th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
</head>

<body>
<header th:fragment="header" class="site-header">
    <div class="container header-inner">
        <div class="brand">
            <a class="logo" th:href="@{/}" th:text="'☕ ' + ${blog?.title ?: 'Java 블로그'}">☕ Java 블로그</a>
            <span class="team">2팀 AIGJ_01_008 박민수</span>
        </div>
        <nav class="nav">
            <a class="btn" th:href="@{/playground}">▶ 코드 실행기</a>
            <a sec:authorize="isAuthenticated()" class="btn btn-primary" th:href="@{/posts/new}">글쓰기</a>
            <a sec:authorize="isAuthenticated()" class="btn" th:href="@{/manage}">관리</a>
            <span sec:authorize="isAuthenticated()" class="who" sec:authentication="name">user</span>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="btn">로그아웃</button>
            </form>
            <a sec:authorize="!isAuthenticated()" class="btn" th:href="@{/login}">로그인</a>
            <a sec:authorize="!isAuthenticated()" class="btn btn-primary" th:href="@{/signup}">회원가입</a>
        </nav>
    </div>
</header>

<aside th:fragment="curriculum" class="sidebar">
    <section class="side-box" th:if="${blog != null}">
        <h3 th:text="${blog.title}">블로그 이름</h3>
        <p class="intro" th:text="${blog.description}">소개</p>
    </section>

    <section class="side-box" th:if="${categories != null}">
        <h3>카테고리</h3>
        <ul class="cat-list">
            <li><a th:href="@{/}">전체 글</a></li>
            <li th:each="c : ${categories}">
                <a th:href="@{/(category=${c.id})}" th:text="${c.name}"
                   th:classappend="${category == c.id} ? 'active'">카테고리</a>
            </li>
        </ul>
    </section>

    <section class="side-box" th:if="${!#lists.isEmpty(curriculum)}">
        <h3>Java 강좌 목차</h3>
        <ol class="toc">
            <li th:each="c : ${curriculum}"
                th:classappend="${post != null and post.id == c.id} ? 'active'">
                <a th:href="@{/posts/{id}(id=${c.id})}" th:text="${c.title}">제목</a>
            </li>
        </ol>
    </section>
</aside>

<nav th:fragment="manageNav" class="manage-nav">
    <h3>블로그 관리</h3>
    <a th:href="@{/posts/new}" class="btn btn-primary manage-write">✏️ 글쓰기</a>
    <a th:href="@{/manage}" th:classappend="${menu == 'posts'} ? 'active'">글 관리</a>
    <th:block th:if="${isAdmin}">
        <a th:href="@{/manage/categories}" th:classappend="${menu == 'categories'} ? 'active'">카테고리 관리</a>
        <a th:href="@{/manage/settings}" th:classappend="${menu == 'settings'} ? 'active'">블로그 설정</a>
    </th:block>
    <a th:href="@{/}">블로그로 가기 →</a>
</nav>

<footer th:fragment="footer" class="site-footer">
    <div class="container" th:text="${blog?.title ?: 'Java 블로그'} + ' · Spring Boot'">Java 블로그 · Spring Boot</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
    <script>hljs.highlightAll();</script>
</footer>
</body>
</html>
