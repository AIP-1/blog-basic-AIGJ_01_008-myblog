<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <title th:text="${title} + ' · Java 블로그'">Java 블로그</title>

    <!-- 링크 공유 시 미리보기 카드 (카카오톡, 페이스북, X, 슬랙 등) -->
    <th:block th:with="desc=${summary ?: 'Java 입문·중급 강좌와 브라우저에서 바로 돌려보는 코드 실행기가 있는 블로그입니다.'}">
        <meta name="description" th:content="${desc}">
        <meta property="og:site_name" content="Java 블로그">
        <meta property="og:type" th:content="${summary != null} ? 'article' : 'website'">
        <meta property="og:title" th:content="${title}">
        <meta property="og:description" th:content="${desc}">
        <meta property="og:url" th:if="${currentUrl != null}" th:content="${currentUrl}">
        <meta property="og:image" th:if="${ogImage != null}" th:content="${ogImage}">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:locale" content="ko_KR">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" th:content="${title}">
        <meta name="twitter:description" th:content="${desc}">
        <meta name="twitter:image" th:if="${ogImage != null}" th:content="${ogImage}">
    </th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
</head>

<body>
<header th:fragment="header" class="site-header">
    <div class="container header-inner">
        <div class="brand">
            <a class="logo" th:href="@{/}">☕ Java 블로그</a>
            <span class="team">2팀 AIGJ_01_008 박민수</span>
        </div>
        <nav class="nav">
            <a class="btn" th:href="@{/playground}">▶ 코드 실행기</a>
            <a sec:authorize="isAuthenticated()" class="btn btn-primary" th:href="@{/posts/new}">글쓰기</a>
            <span sec:authorize="isAuthenticated()" class="who" sec:authentication="name">user</span>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="btn">로그아웃</button>
            </form>
            <a sec:authorize="!isAuthenticated()" class="btn" th:href="@{/login}">로그인</a>
            <a sec:authorize="!isAuthenticated()" class="btn btn-primary" th:href="@{/signup}">회원가입</a>
        </nav>
    </div>
</header>

<aside th:fragment="curriculum" class="sidebar">
    <h3>Java 강좌 목차</h3>
    <ol class="toc">
        <li th:each="c : ${curriculum}"
            th:classappend="${post != null and post.id == c.id} ? 'active'">
            <a th:href="@{/posts/{id}(id=${c.id})}" th:text="${c.title}">제목</a>
        </li>
    </ol>
</aside>

<footer th:fragment="footer" class="site-footer">
    <div class="container">Java 블로그 · Spring Boot</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
    <script>hljs.highlightAll();</script>
</footer>
</body>
</html>
