<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${post.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container layout">
    <aside th:replace="~{fragments/layout :: curriculum}"></aside>

    <article class="content">
        <a class="badge" th:href="@{/(category=${post.category?.id})}" th:text="${post.categoryName}">카테고리</a>
        <span class="status-chip" th:unless="${post.public}" th:text="${post.status.label}"
              th:classappend="${post.status.name().toLowerCase()}">비공개</span>
        <h1 th:text="${post.title}">제목</h1>
        <div class="meta">
            <span th:text="${post.author.username}">작성자</span> ·
            <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
            <span th:if="${post.updatedAt.isAfter(post.createdAt)}">(수정됨)</span>
        </div>

        <p class="notice-box" th:if="${post.draft}">임시저장된 글이에요. 다른 사람에게는 보이지 않아요.
            <a th:href="@{/posts/{id}/edit(id=${post.id})}">이어서 쓰고 발행하기 →</a></p>
        <p class="notice-box" th:if="${post.status.name() == 'PRIVATE'}">비공개 글이에요. 나와 관리자만 볼 수 있어요.</p>

        <div th:if="${canEdit}" class="actions">
            <a class="btn" th:href="@{/posts/{id}/edit(id=${post.id})}">수정</a>
            <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" class="inline"
                  onsubmit="return confirm('정말 삭제할까요?');">
                <button type="submit" class="btn btn-danger">삭제</button>
            </form>
        </div>

        <div class="markdown" th:utext="${html}">본문</div>

        <div class="share" th:if="${post.public}" th:with="shareText=${post.title + ' - ' + (blog?.title ?: 'Java 블로그')}">
            <span class="share-label">공유하기</span>
            <a class="share-btn" title="X(트위터)에 공유" target="_blank" rel="noopener"
               th:href="@{https://twitter.com/intent/tweet(text=${shareText}, url=${currentUrl})}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                <span>X</span>
            </a>
            <a class="share-btn" title="페이스북에 공유" target="_blank" rel="noopener"
               th:href="@{https://www.facebook.com/sharer/sharer.php(u=${currentUrl})}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
                <span>페이스북</span>
            </a>
            <a class="share-btn" title="링크드인에 공유" target="_blank" rel="noopener"
               th:href="@{https://www.linkedin.com/sharing/share-offsite/(url=${currentUrl})}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.125 2.062 2.062 0 0 1 0 4.125zM7.119 20.452H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                <span>링크드인</span>
            </a>
            <button type="button" class="share-btn" id="copy-link" th:data-url="${currentUrl}">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                <span>링크 복사</span>
            </button>
            <button type="button" class="share-btn" id="native-share" hidden
                    th:data-url="${currentUrl}" th:data-title="${shareText}" th:data-text="${summary}">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
                <span>더보기 (카카오톡 등)</span>
            </button>
            <span class="share-toast" id="share-toast" role="status"></span>
        </div>

        <nav class="prev-next" th:if="${prev != null or next != null}">
            <a th:if="${prev != null}" th:href="@{/posts/{id}(id=${prev.id})}">← <span th:text="${prev.title}"></span></a>
            <span th:unless="${prev != null}"></span>
            <a th:if="${next != null}" th:href="@{/posts/{id}(id=${next.id})}"><span th:text="${next.title}"></span> →</a>
        </nav>

        <section id="comments" class="comments">
            <h3>댓글 <span th:text="${post.comments.size()}">0</span></h3>
            <ul>
                <li th:each="c : ${post.comments}">
                    <div class="meta">
                        <strong th:text="${c.author.username}">작성자</strong> ·
                        <span th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
                        <form sec:authorize="isAuthenticated()"
                              th:if="${c.author.username == #authentication.name or #authorization.expression('hasRole(''ADMIN'')')}"
                              th:action="@{/comments/{id}/delete(id=${c.id})}" method="post" class="inline">
                            <button type="submit" class="link">삭제</button>
                        </form>
                    </div>
                    <p th:text="${c.content}">댓글 내용</p>
                </li>
            </ul>
            <form sec:authorize="isAuthenticated()" th:action="@{/posts/{id}/comments(id=${post.id})}" method="post"
                  class="comment-form">
                <textarea name="content" rows="3" maxlength="1000" placeholder="댓글을 입력하세요" required></textarea>
                <button type="submit" class="btn btn-primary">등록</button>
            </form>
            <p sec:authorize="!isAuthenticated()" class="hint">
                댓글을 쓰려면 <a th:href="@{/login}">로그인</a>하세요.
            </p>
        </section>
    </article>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:inline="javascript">
    // Java 코드 블록마다 '실행해보기' 버튼을 붙여 코드 실행기로 보낸다
    const playgroundUrl = /*[[@{/playground}]]*/ '/playground';
    document.querySelectorAll('.markdown pre > code.language-java').forEach(code => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'run-btn';
        button.textContent = '▶ 실행해보기';
        button.addEventListener('click', () => {
            try { sessionStorage.setItem('playground.code', code.textContent); } catch (e) { /* 무시 */ }
            location.href = playgroundUrl;
        });
        code.parentElement.classList.add('runnable');
        code.parentElement.appendChild(button);
    });

    // 공유: 링크 복사 + 기기 기본 공유창(모바일에서 카카오톡 등). 공개 글에만 공유 영역이 있다
    const toast = document.getElementById('share-toast');
    if (toast) {
        const showToast = message => {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast.timer);
            toast.timer = setTimeout(() => toast.classList.remove('show'), 2000);
        };

        document.getElementById('copy-link').addEventListener('click', async e => {
            const url = e.currentTarget.dataset.url;
            try {
                await navigator.clipboard.writeText(url);
            } catch (err) {
                // http(비보안) 환경에서는 clipboard API 가 막혀 있어 예전 방식으로 복사
                const temp = document.createElement('textarea');
                temp.value = url;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                temp.remove();
            }
            showToast('링크를 복사했어요');
        });

        const nativeShare = document.getElementById('native-share');
        if (navigator.share) {
            nativeShare.hidden = false;
            nativeShare.addEventListener('click', () => {
                const {url, title, text} = nativeShare.dataset;
                navigator.share({url, title, text}).catch(() => { /* 사용자가 취소 */ });
            });
        }
    }
</script>
</body>
</html>
