<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('홈')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<div class="container">
    <nav th:replace="~{fragments/layout :: topMenu}"></nav>
</div>
<main class="container layout with-top-menu">
    <aside th:replace="~{fragments/layout :: curriculum}"></aside>

    <section class="content">
        <p class="hint search-result" th:if="${!#strings.isEmpty(q)}">
            '<strong th:text="${q}">검색어</strong>' 검색 결과 <span th:text="${posts.totalElements}">0</span>건
            · 작성자 → 제목 → 내용 순 <a th:href="@{/}">검색 지우기</a>
        </p>

        <th:block th:replace="~{fragments/layout :: postList(${posts})}"></th:block>

        <nav class="pagination" th:if="${posts.totalPages > 1}">
            <a th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}"
               th:href="@{/(page=${i}, category=${category}, q=${#strings.isEmpty(q) ? null : q})}"
               th:text="${i + 1}"
               th:classappend="${i == posts.number} ? 'current'">1</a>
        </nav>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
