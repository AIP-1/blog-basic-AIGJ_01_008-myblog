<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container narrow">
    <h1>로그인</h1>
    <p class="notice" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>

    <form th:action="@{/login}" method="post" class="form">
        <label>아이디 <input type="text" name="username" required autofocus></label>
        <label>비밀번호 <input type="password" name="password" required></label>
        <div class="actions">
            <button type="submit" class="btn btn-primary">로그인</button>
            <a class="btn" th:href="@{/signup}">회원가입</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
