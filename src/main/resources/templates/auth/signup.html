<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container narrow">
    <h1>회원가입</h1>

    <form th:action="@{/signup}" th:object="${form}" method="post" class="form">
        <label>아이디 <input type="text" th:field="*{username}" autofocus></label>
        <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

        <label>비밀번호 <input type="password" th:field="*{password}"></label>
        <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <label>비밀번호 확인 <input type="password" th:field="*{passwordConfirm}"></label>
        <p class="error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>

        <div class="actions">
            <button type="submit" class="btn btn-primary">가입하기</button>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
