<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('글 관리')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container manage-layout">
    <nav th:replace="~{fragments/layout :: manageNav}"></nav>

    <section class="content">
        <h1>글 관리</h1>
        <p class="hint" th:if="${isAdmin}">관리자는 모든 사용자의 글을 관리할 수 있어요.</p>
        <p class="notice" th:if="${message}" th:text="${message}"></p>

        <form class="search manage-search" th:action="@{/manage}" method="get" role="search">
            <input type="hidden" name="status" th:value="${status}" th:if="${status != null}">
            <input type="search" name="q" th:value="${q}" aria-label="글 검색"
                   th:placeholder="${isAdmin} ? '제목·내용·작성자 검색' : '제목·내용 검색'">
            <button type="submit" class="btn">검색</button>
            <a th:if="${!#strings.isEmpty(q)}" class="btn" th:href="@{/manage(status=${status})}">검색 지우기</a>
        </form>
        <p class="hint" th:if="${!#strings.isEmpty(q)}">
            '<strong th:text="${q}">검색어</strong>' 검색 결과 <span th:text="${posts.totalElements}">0</span>건</p>

        <nav class="tabs">
            <a th:href="@{/manage(q=${#strings.isEmpty(q) ? null : q})}" th:classappend="${status == null} ? 'active'">전체 <span th:text="${total}">0</span></a>
            <a th:each="s : ${statuses}" th:href="@{/manage(status=${s}, q=${#strings.isEmpty(q) ? null : q})}"
               th:classappend="${status == s} ? 'active'">
                <span th:text="${s.label}">공개</span> <span th:text="${counts[s.name()]}">0</span>
            </a>
        </nav>

        <p th:if="${posts.empty}" class="empty" th:text="${#strings.isEmpty(q)} ? '글이 없습니다.' : '검색 결과가 없습니다.'">글이 없습니다.</p>

        <table class="manage-table" th:unless="${posts.empty}">
            <thead>
            <tr>
                <th>제목</th>
                <th>카테고리</th>
                <th>상태</th>
                <th>수정일</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${posts}">
                <td class="col-title">
                    <span class="status-chip notice-chip" th:if="${p.notice}">공지</span>
                    <a th:href="@{/posts/{id}(id=${p.id})}" th:text="${p.title}">제목</a>
                    <span class="meta" th:if="${isAdmin}" th:text="${p.author.username}">작성자</span>
                </td>
                <td th:text="${p.categoryName}">카테고리</td>
                <td><span class="status-chip" th:classappend="${p.status.name().toLowerCase()}"
                          th:text="${p.status.label}">공개</span></td>
                <td class="meta" th:text="${#temporals.format(p.updatedAt, 'yyyy-MM-dd HH:mm')}">날짜</td>
                <td class="col-actions">
                    <a class="btn btn-sm" th:href="@{/posts/{id}/edit(id=${p.id})}"
                       th:text="${p.draft} ? '이어쓰기' : '수정'">수정</a>
                    <form th:unless="${p.draft}" th:action="@{/manage/posts/{id}/status(id=${p.id})}" method="post"
                          class="inline">
                        <input type="hidden" name="status" th:value="${p.public} ? 'PRIVATE' : 'PUBLIC'">
                        <input type="hidden" name="filter" th:value="${status}">
                        <input type="hidden" name="q" th:value="${q}">
                        <button type="submit" class="btn btn-sm" th:text="${p.public} ? '비공개로' : '공개로'">비공개로</button>
                    </form>
                    <form th:if="${isAdmin and p.public}" th:action="@{/manage/posts/{id}/notice(id=${p.id})}"
                          method="post" class="inline">
                        <input type="hidden" name="notice" th:value="${!p.notice}">
                        <input type="hidden" name="filter" th:value="${status}">
                        <input type="hidden" name="q" th:value="${q}">
                        <button type="submit" class="btn btn-sm" th:text="${p.notice} ? '공지 해제' : '공지 등록'">공지 등록</button>
                    </form>
                    <form th:action="@{/manage/posts/{id}/delete(id=${p.id})}" method="post" class="inline"
                          onsubmit="return confirm('정말 삭제할까요? 되돌릴 수 없어요.');">
                        <input type="hidden" name="filter" th:value="${status}">
                        <input type="hidden" name="q" th:value="${q}">
                        <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <nav class="pagination" th:if="${posts.totalPages > 1}">
            <a th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}"
               th:href="@{/manage(page=${i}, status=${status}, q=${#strings.isEmpty(q) ? null : q})}"
               th:text="${i + 1}"
               th:classappend="${i == posts.number} ? 'current'">1</a>
        </nav>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
